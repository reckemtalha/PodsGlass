name: APK Derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: APK derle
        run: gradle assembleDebug --no-daemon
      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk PodsGlass.apk
      - name: Telefona indirmek için yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PodsGlass (son sürüm)
          body: Bu sayfayı Samsung'da aç ve PodsGlass.apk dosyasına dokunarak indir.
          files: PodsGlass.apk
          make_latest: true
